version: '3.8'

services:
  blood-donor-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blood-donor-platform
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/prod.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    volumes:
      - db_data:/app/prisma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/donors"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
    driver: local
